name: Release APK

# Push a tag like v1.0.1 (or run manually) to build a signed APK and publish it as a GitHub Release.
# The phone app checks the latest release and installs it over the old version.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the one signing certificate every release must use (stops an accidental key change).
      EXPECTED_CERT_SHA256: "25e6fb340eda3421d611e7cff81c91f450aa10ad78944efb667b58ca1c308e48"
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Bad version: $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore and check signing key
        env:
          KEYSTORE_B64: ${{ secrets.RADAR_KEYSTORE_BASE64 }}
          RAW_PASSWORD: ${{ secrets.RADAR_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Missing secret RADAR_KEYSTORE_BASE64"; exit 1; }
          [ -n "$RAW_PASSWORD" ] || { echo "::error::Missing secret RADAR_KEYSTORE_PASSWORD"; exit 1; }
          # Pasted secrets often carry stray spaces or line breaks: strip them.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::RADAR_KEYSTORE_BASE64 isn't valid base64. Re-paste the whole file contents."; exit 1; }
          PW=$(printf '%s' "$RAW_PASSWORD" | tr -d ' \r\n\t')
          echo "::add-mask::$PW"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" >/dev/null 2>&1 \
            || { echo "::error::RADAR_KEYSTORE_PASSWORD doesn't open the keystore. Re-paste it from RADAR_KEYSTORE_PASSWORD.txt."; exit 1; }
          echo "RADAR_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "Signing key OK"

      - name: Build signed APK
        env:
          RADAR_KEYSTORE: ${{ runner.temp }}/release.jks
        run: ./gradlew assembleRelease -PradarVersion=${{ steps.v.outputs.version }} --no-daemon --stacktrace

      - name: Check signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          GOT=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "cert: $GOT"
          [ "$GOT" = "$EXPECTED_CERT_SHA256" ] || { echo "APK is signed with the wrong key"; exit 1; }
          cp "$APK" "claude-radar-${{ steps.v.outputs.version }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          gh release create "v$V" "claude-radar-$V.apk" \
            --title "Claude Radar $V" --generate-notes --latest \
            $( [ "${{ github.event_name }}" = "push" ] && echo "--verify-tag" )
